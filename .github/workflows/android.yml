name: Android CI

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses
      - name: Install SDK components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Make gradle executable
        run: chmod +x gradlew
      - name: Run unit tests and coverage
        run: ./gradlew --no-daemon --stacktrace --info test jacocoTestReport assembleDebug
      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-unit
          path: |
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/tests/testReleaseUnitTest/**
      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: |
            app/build/reports/jacoco/jacocoTestReport/html/**
            app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
      - name: Upload Gradle reports (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
      - name: Upload app build dir (always, debug aid)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-build-dir
          path: app/build/**
          if-no-files-found: ignore
      - name: Upload JVM screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-jvm
          path: app/build/outputs/roborazzi/screens/**/*.png
          if-no-files-found: ignore
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Create prerelease with debug APK (manual or tag)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('prerelease-{0}', github.run_id) }}
          name: Nightly build ${{ github.run_id }}
          files: |
            app/build/outputs/apk/debug/app-debug.apk

  instrumented:
    name: Instrumented tests (AVD)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 34]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses
      - name: Install SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "platforms;android-${{ matrix.api-level }}" \
            "system-images;android-${{ matrix.api-level }};google_apis;x86_64"
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chown $USER /dev/kvm || true
      - name: AVD cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-google_apis-x86_64
      - name: Run connected tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: Nexus 9
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot
          script: |
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug assembleAndroidTest
            adb devices
            # Keep screen awake and unlock before tests
            adb shell settings put system screen_off_timeout 2147483647 || true
            adb shell svc power stayon true || true
            adb shell input keyevent 82 || true
            adb shell wm dismiss-keyguard || true
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            # Run tests but always collect diagnostics before exiting with the test status
            set +e
            ./gradlew --no-daemon connectedDebugAndroidTest
            TEST_EXIT=$?
            mkdir -p artifacts/logcat artifacts/screenshots artifacts/screenshots/api${{ matrix.api-level }}
            adb logcat -d > artifacts/logcat/logcat-api${{ matrix.api-level }}.txt || true
            # Pull emulator screenshots written by tests
            adb pull /sdcard/Android/data/com.g7nightalarm.app.debug/files/screenshots artifacts/screenshots/api${{ matrix.api-level }} || true
            # Also try copying from internal app storage via run-as, then pull again (Android 13/14 restricts /sdcard/Android/data)
            adb shell run-as com.g7nightalarm.app.debug sh -c 'if [ -d files/screenshots ]; then mkdir -p /sdcard/Android/data/com.g7nightalarm.app.debug/files/screenshots && cp -f files/screenshots/* /sdcard/Android/data/com.g7nightalarm.app.debug/files/screenshots/ 2>/dev/null || true; fi' || true
            adb pull /sdcard/Android/data/com.g7nightalarm.app.debug/files/screenshots artifacts/screenshots/api${{ matrix.api-level }} || true
            # Public Pictures fallback (written by tests when screencap is used)
            adb pull /sdcard/Pictures/g7-night-alarm artifacts/screenshots/api${{ matrix.api-level }} || true
            exit $TEST_EXIT
      - name: Upload connected test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumented-results-api${{ matrix.api-level }}
          path: |
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
          if-no-files-found: ignore
      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat-api${{ matrix.api-level }}
          path: artifacts/logcat/**
          if-no-files-found: ignore
      - name: Upload emulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-emulator-api${{ matrix.api-level }}
          path: artifacts/screenshots/**
          if-no-files-found: ignore

  instrumented-phone:
    name: Instrumented tests (Phone AVD API 34)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses
      - name: Install SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "platforms;android-34" \
            "system-images;android-34;google_apis;x86_64"
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chown $USER /dev/kvm || true
      - name: Run connected tests on phone
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: Pixel 4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot
          script: |
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug assembleAndroidTest
            adb devices
            adb shell settings put system screen_off_timeout 2147483647 || true
            adb shell svc power stayon true || true
            adb shell input keyevent 82 || true
            adb shell wm dismiss-keyguard || true
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            set +e
            ./gradlew --no-daemon connectedDebugAndroidTest
            TEST_EXIT=$?
            mkdir -p artifacts-phone/logcat artifacts-phone/screenshots
            adb logcat -d > artifacts-phone/logcat/logcat-phone-api34.txt || true
            adb pull /sdcard/Android/data/com.g7nightalarm.app.debug/files/screenshots artifacts-phone/screenshots || true
            adb shell run-as com.g7nightalarm.app.debug sh -c 'if [ -d files/screenshots ]; then mkdir -p /sdcard/Android/data/com.g7nightalarm.app.debug/files/screenshots && cp -f files/screenshots/* /sdcard/Android/data/com.g7nightalarm.app.debug/files/screenshots/ 2>/dev/null || true; fi' || true
            adb pull /sdcard/Android/data/com.g7nightalarm.app.debug/files/screenshots artifacts-phone/screenshots || true
            adb pull /sdcard/Pictures/g7-night-alarm artifacts-phone/screenshots || true
            exit $TEST_EXIT
      - name: Upload phone connected test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumented-results-phone-api34
          path: |
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
          if-no-files-found: ignore
      - name: Upload phone logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat-phone-api34
          path: artifacts-phone/logcat/**
          if-no-files-found: ignore
      - name: Upload phone emulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-emulator-phone-api34
          path: artifacts-phone/screenshots/**
          if-no-files-found: ignore

  firebase-test-lab:
    name: Firebase Test Lab (manual/main only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    env:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
    steps:
      - name: Check secrets present
        run: |
          if [ -z "${GCP_SA_KEY}" ] || [ -z "${FIREBASE_PROJECT_ID}" ]; then
            echo "Firebase secrets missing; skipping Test Lab run."
            echo "GCP_SA_KEY or FIREBASE_PROJECT_ID not set."
            exit 0
          fi
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses
      - name: Install SDK components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleAndroidTest
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.FIREBASE_PROJECT_ID }}
          service_account_key: ${{ env.GCP_SA_KEY }}
      - name: Run on Test Lab (physical tablet if available)
        continue-on-error: true
        run: |
          set -x
          # Try to find a physical tablet device supporting API 30+; fallback to a phone
          PHYSICAL_MODEL=$(gcloud firebase test android models list --format="value(id)" --filter="form=PHYSICAL AND formFactor:TABLET" | head -n1)
          if [ -z "$PHYSICAL_MODEL" ]; then PHYSICAL_MODEL=redfin; fi
          gcloud firebase test android run \
            --type instrumentation \
            --app app/build/outputs/apk/debug/app-debug.apk \
            --test app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            --device model=$PHYSICAL_MODEL,version=30,locale=en,orientation=landscape \
            --timeout 10m
      - name: Run on Test Lab (virtual device)
        continue-on-error: true
        run: |
          set -x
          VIRTUAL_MODEL=$(gcloud firebase test android models list --format="value(id)" --filter="form=VIRTUAL AND formFactor:TABLET" | head -n1)
          if [ -z "$VIRTUAL_MODEL" ]; then VIRTUAL_MODEL=MediumPhone.arm; fi
          gcloud firebase test android run \
            --type instrumentation \
            --app app/build/outputs/apk/debug/app-debug.apk \
            --test app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            --device model=$VIRTUAL_MODEL,version=30,locale=en,orientation=landscape \
            --timeout 10m


